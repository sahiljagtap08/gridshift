services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: http://localhost:3000
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      - api
